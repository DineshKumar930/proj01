<html>
<body>
<img src="off.png" id="img">
<button onclick="fun1()" id="btn">Off</button>

<script>
function fun1(){
let img=document.getElementById("img")
let btn=document.getElementById("btn")
if(img.src.includes('off.png')){
img.src='on.png'
btn.innerHTML='On'
}else{
img.src='off.png'
btn.innerHTML='off'
}

}


</script>
</body>
</html>
